# Default configuration for k8s-drift-sync (generic)
# Adjust kubeconfig_context and repo URL/paths to your environment

clusters:
  - name: dev
    kubeconfig_context: dev-context
    repos:
      - name: platform
        url: https://github.com/org/repo.git
        branch: main
        paths:
          - k8s/namespaces/dev

settings:
  output_dir: out
  ignore_k8s_fields:
    - metadata.resourceVersion
    - metadata.uid
    - metadata.creationTimestamp
    - metadata.generation
    - metadata.managedFields
    - metadata.annotations.kubectl.kubernetes.io/last-applied-configuration
    - status 