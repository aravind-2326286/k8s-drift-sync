# Example configuration for k8s-drift-sync
# Copy this file to config.yaml and adjust values

clusters:
  - name: dev
    kubeconfig_context: dev-context
    repos:
      - name: platform
        url: https://github.com/org/repo.git
        branch: main
        paths:
          - k8s/namespaces/dev
  - name: prod
    kubeconfig_context: prod-context
    repos:
      - name: platform
        url: https://github.com/org/repo.git
        branch: main
        paths:
          - k8s/namespaces/prod

# Optional global settings
settings:
  output_dir: out
  ignore_k8s_fields:
    - metadata.resourceVersion
    - metadata.uid
    - metadata.creationTimestamp
    - metadata.generation
    - metadata.managedFields
    - metadata.annotations.kubectl.kubernetes.io/last-applied-configuration
    - status 